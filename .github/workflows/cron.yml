# BYGENCY 정기 실행(크론)
#
# Cloudflare Pages Functions 에는 자체 스케줄러가 없다. 그래서 "정해진 시각에 서버가
# 알아서 도는 일"은 전부 외부에서 HTTP 로 두드려 줘야 한다.
# 그 역할은 Cloudflare Workers Cron Trigger(workers/cron/)가 맡고, 이 워크플로는
# 손으로 한 번 돌리고 싶을 때 쓰는 예비 경로다.
#
# ── 비용 ──────────────────────────────────────────────────────────────────────
#  이 저장소는 공개(public) 저장소이므로 GitHub Actions 사용료가 0원이다.
#  (공개 저장소의 표준 GitHub 호스팅 러너는 분당 과금 대상이 아니며 사용량 한도가 없다.
#   비공개 저장소로 바꾸면 그때부터 무료 분(minutes) 한도가 적용되니 주의.)
#  실행 자체는 curl 한두 번이라 러너 점유 시간도 몇 초 수준이다.
#  단, 예약 생성이 실제로 영상을 만들면 그건 BYGENCY 크레딧/모델 API 비용이 든다.
#  ⚠ 스케줄 워크플로는 저장소에 60일간 아무 활동(커밋 등)이 없으면 GitHub 이 자동으로
#    비활성화한다. 그때는 Actions 탭에서 "Enable workflow" 를 누르면 다시 돈다.
#
# ── 준비물(한 번만) ───────────────────────────────────────────────────────────
#  1) Cloudflare Pages → 프로젝트 → Settings → Variables and Secrets 에
#     CRON_TOKEN = (아무도 모르는 긴 임의 문자열) 등록 후 재배포
#  2) GitHub → Settings → Secrets and variables → Actions
#       Secrets:   CRON_TOKEN  (위와 똑같은 값)
#       Variables: SITE_URL    (예: https://bygency.co)  — 없으면 아래 기본값 사용
#  ※ 정기 실행 쪽 설정은 workers/cron/README.md 참고
#
# ── 왜 스케줄이 없는가 ────────────────────────────────────────────────────────
#  GitHub 의 스케줄 실행은 혼잡 시 수 분~수십 분 지연될 수 있다(공식 문서 명시).
#  그래서 정기 실행은 Cloudflare Workers Cron Trigger 로 옮겼다 → workers/cron/
#  여기 남은 것은 수동 실행 전용 예비 경로다.

name: cron

# ⚠ 자동 스케줄은 꺼져 있다 — 정기 실행은 Cloudflare Workers Cron Trigger(workers/cron)가 맡는다.
#   (둘 다 켜 두면 같은 예약을 두 번 집어갈 수 있어 한쪽만 스케줄을 갖는다.)
#   이 워크플로는 "워커가 죽었을 때 손으로 한 번 돌리는" 예비 수단으로 남겨 둔다.
#   Actions 탭 → cron → Run workflow 에서 실행.
on:
  workflow_dispatch:
    inputs:
      job:
        description: '수동 실행할 작업'
        required: true
        default: 'video'
        type: choice
        options: [video, naver, both]

concurrency:
  group: bygency-cron-${{ github.event.inputs.job }}
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://bygency.co' }}

jobs:
  # ── 예약 영상 생성 ─────────────────────────────────────────────────────────
  video-schedules:
    if: contains(fromJSON('["video","both"]'), github.event.inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 실행할 예약이 있는지 확인
        id: due
        run: |
          body=$(curl -sS --max-time 30 -H "X-Cron-Token: ${{ secrets.CRON_TOKEN }}" \
                   "$SITE_URL/api/cron/video-schedules")
          echo "$body"
          echo "count=$(echo "$body" | grep -o '"due":[0-9]*' | cut -d: -f2)" >> "$GITHUB_OUTPUT"

      - name: 예약 처리
        if: steps.due.outputs.count != '0'
        run: |
          # 한 번 호출에 최대 5건만 처리하므로, 밀린 예약이 있으면 몇 번 더 두드린다.
          for i in 1 2 3 4; do
            res=$(curl -sS --max-time 120 -X POST \
                    -H "X-Cron-Token: ${{ secrets.CRON_TOKEN }}" \
                    "$SITE_URL/api/cron/video-schedules")
            echo "[$i] $res"
            echo "$res" | grep -q '"processed":0' && break
            sleep 3
          done

  # ── 네이버 플레이스 순위 추적 ──────────────────────────────────────────────
  naver-place:
    if: contains(fromJSON('["naver","both"]'), github.event.inputs.job)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 추적 키워드 순위 갱신(20건씩 배치)
        run: |
          offset=0
          for i in $(seq 1 50); do
            res=$(curl -sS --max-time 180 -X POST \
                    -H "X-Cron-Token: ${{ secrets.CRON_TOKEN }}" \
                    "$SITE_URL/api/naver-place/update-all-tracking?offset=$offset&limit=20")
            echo "[offset=$offset] $(echo "$res" | head -c 400)"
            # 더 처리할 게 없으면(hasMore:false 또는 처리 0건) 끝낸다
            echo "$res" | grep -q '"hasMore":true' || break
            offset=$((offset + 20))
            sleep 2
          done
