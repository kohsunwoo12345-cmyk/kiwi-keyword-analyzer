# BYGENCY 크론 워커 — Pages 프로젝트와는 별개로 배포되는 아주 작은 워커.
#
# Cloudflare Pages Functions 에는 스케줄러가 없다. 반면 Workers 에는 Cron Triggers 가 있고
# 무료 플랜에서도 쓸 수 있다. 그래서 "시계" 역할만 이 워커가 맡고, 실제 일은
# 기존 Pages 엔드포인트(/api/cron/...)를 HTTP 로 호출해서 시킨다.
# → 로직이 두 군데로 갈라지지 않는다. 이 워커는 두드리기만 한다.
#
# 배포:  cd workers/cron && npx wrangler deploy
# 토큰:  npx wrangler secret put CRON_TOKEN     (Pages 에 넣은 값과 똑같이)
#
# ⚠ Cloudflare Workers Builds(저장소 연결)로 배포할 때, 루트 디렉터리를 저장소 최상단(/)
#   으로 두었다면 배포 명령이 반드시 이 설정 파일을 가리켜야 한다:
#       npx wrangler deploy -c workers/cron/wrangler.toml
#   그냥 `npx wrangler deploy` 로 두면 최상단 wrangler.toml(= Pages 설정)을 읽고
#   "Missing entry-point to Worker script" 로 죽는다. 아래 main 은 이 파일 위치를
#   기준으로 풀리므로, -c 만 붙으면 최상단에서 실행해도 정상 동작한다.

# ⚠ 이름은 Cloudflare 에 만들어진 Workers 프로젝트 이름과 같아야 한다.
#   다르면 배포 때 "Failed to match Worker name" 경고가 나고 CI 쪽 이름으로 덮어써진다
#   (그리고 Cloudflare 가 이걸 고치는 PR 을 열려고 한다).
name = "kiwi-keyword-analyzer"
main = "src/index.js"
compatibility_date = "2026-07-01"

# ⚠ Cloudflare 의 cron 표현식은 GitHub 과 마찬가지로 항상 UTC 다.
#   하지만 "예약 생성"의 실제 실행 시각은 이 표에 있지 않다. 회원이 스튜디오에서 고른
#   나라의 현지 시각(서머타임 포함)으로 서버가 계산해 두고, 이 워커는 자주 두드려서
#   "지금 때가 된 예약"을 서버가 집어가게 할 뿐이다.
#   1분마다 도는 이유: 예약 시각(정시)에 최대한 붙여서 실행하기 위해서다. 주기가 길면
#   크론이 한 번 밀렸을 때 그만큼 통째로 늦어진다. 1분 주기는 하루 1440회로,
#   무료 플랜 하루 10만 요청의 1.4% 수준이라 비용 부담이 없다.
#   (인도 UTC+5:30·네팔 UTC+5:45 처럼 30·45분 오프셋 지역도 자연히 커버된다)
[triggers]
crons = [
  "* * * * *",      # 예약 영상 생성 처리 — 1분마다
  "5 0 * * *",      # 네이버 플레이스 순위 추적 (00:05 UTC = 한국 09:05)
  "20 * * * *",     # 생성물 보관 그물 — 매시 20분
  "35 * * * *",     # 결말 없는 차감 회수 — 매시 35분
]
#  ⚠ 결말 없는 차감 회수가 없으면, 실패했는데 돌려주지 않은 크레딧이 조용히 쌓인다.
#    비동기 영상은 제출 순간에 차감하고, 그 돈이 돌아오는 길은 브라우저 폴링뿐이었다 —
#    탭을 닫거나(영상은 몇 분 걸린다) 폴링이 20분을 넘기면 아무도 되돌리지 않았다.
#    이 작업이 우리 폴링 창구에 직접 물어보고 실패로 확인되면 그 자리에서 되돌린다
#    (상태 조회는 돈이 들지 않는다 — 만들라고 시키는 게 아니다).
#  ⚠ 보관 그물이 하루 한 번이면 의미가 없다. 제공사 결과 주소는 며칠이면 만료되는데,
#    평소에는 생성이 끝나는 자리에서 바로 옮기므로 여기 걸리는 건 "그때 실패한 것" 뿐이다.
#    원본이 살아 있는 동안 주워야 해서 매시간 돈다(대부분은 옮길 게 0건이라 GET 한 번으로 끝난다).

[vars]
SITE_URL = "https://bygency.co"

# 관측: 실행 로그를 대시보드에서 볼 수 있게(무료 플랜 포함)
[observability]
enabled = true
