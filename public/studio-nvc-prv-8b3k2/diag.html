<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>씨댄스 진단 — 어디서 끊기는지</title>
<style>
:root{--bg:#0c0e13;--card:#161a22;--line:#252b36;--txt:#e6e9f2;--dim:#9aa4b2;--ok:#22c55e;--ng:#ef4444;--wait:#64748b;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Inter','Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:20px;margin:0 0 6px;font-weight:800}
.sub{color:var(--dim);font-size:13px;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;font-weight:700}
button{background:#4f46e5;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
button:disabled{background:#333a48;color:#7b8494;cursor:default}
button.ghost{background:#222836;color:var(--txt)}
table{width:100%;border-collapse:collapse;margin-top:4px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px}
td.s{width:34px;font-size:16px}
td.t{width:76px;color:var(--dim);font-variant-numeric:tabular-nums}
.name{font-weight:600}
.why{color:var(--dim);font-size:12.5px;margin-top:2px}
.detail{color:var(--dim);font-size:12px;margin-top:4px;word-break:break-all;white-space:pre-wrap}
.bad{color:var(--ng);font-weight:700}
.good{color:var(--ok)}
.verdict{border-radius:10px;padding:14px 16px;margin-top:4px;font-size:14px;display:none}
.verdict.show{display:block}
.verdict.ng{background:#2a1416;border:1px solid #5b2226}
.verdict.ok{background:#12241a;border:1px solid #24503a}
.hint{color:var(--dim);font-size:12.5px;margin-top:8px}
code{background:#0f1319;padding:1px 5px;border-radius:4px;font-size:12px}
</style></head><body><div class="wrap">

<h1>씨댄스 진단</h1>
<p class="sub">생성이 502 로 끊길 때, <b>어느 단계에서 끊기는지</b>를 찾습니다.
단계를 하나씩 따로 보내서, 어느 요청이 돌아오지 않는지 봅니다.</p>

<div class="card">
  <h2>① 무엇으로 검사할까</h2>
  <div id="src">불러오는 중…</div>
  <div class="hint">스튜디오에서 씨댄스 2.0 을 한 번 실행하면(성공·실패 무관) 그 요청이 여기 저장됩니다.
    없으면 비슷한 크기의 가짜 사진으로 대신 검사합니다.</div>
</div>

<div class="card">
  <h2>② 검사</h2>
  <button id="run">검사 시작</button>
  <button id="copy" class="ghost" style="display:none">결과 복사</button>
  <table id="tb"><thead><tr><th class="s"></th><th>단계</th><th class="t">시간</th></tr></thead><tbody></tbody></table>
  <div id="verdict" class="verdict"></div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var tb=$('#tb').tBodies[0];

/* 검사할 단계. 각각 따로 보낸다 —
   한 요청 안에서 이어 하면, 죽는 순간 앞 단계 결과까지 같이 사라져서 어디서 죽었는지 못 본다. */
var STAGES=[
  {k:'auth',    n:'로그인 확인',      why:'내가 누구인지, 관리자인지 회원인지'},
  {k:'body',    n:'사진·본문 읽기',   why:'보낸 사진이 서버까지 온전히 들어오는지'},
  {k:'gate',    n:'과금 계산',        why:'회원만 지나가는 구간 — 관리자는 원래 안 탄다'},
  {k:'payload', n:'제공사용 값 만들기',why:'제공사에 보낼 형태로 바꾸는 것까지'},
  {k:'',        n:'실제 제출',        why:'제공사를 실제로 부른다 — 여기서만 돈이 든다'}
];

var lastParams=null, lastKB=0, synthetic=false;

function loadSource(){
  try{
    var raw=localStorage.getItem('bg_last_gen_params');
    if(raw){
      var o=JSON.parse(raw);
      if(o&&o.params){ lastParams=o.params; lastKB=o.kb||0;
        $('#src').innerHTML='<span class="good">✓</span> 스튜디오에서 마지막으로 실행한 요청을 씁니다.<div class="detail">'
          +esc(o.params.model||'(모델 없음)')+' · '+lastKB+'KB · '+esc(String(o.at||'').slice(0,19).replace('T',' '))+'</div>';
        return;
      }
    }
  }catch(e){}
  synthetic=true;
  $('#src').innerHTML='저장된 요청이 없습니다 — <b>가짜 사진 약 300KB</b> 로 대신 검사합니다.';
}

/* 저장된 요청이 없을 때 쓸 대체물 — 실제와 비슷한 크기로 만든다 */
function syntheticParams(){
  var c=document.createElement('canvas'); c.width=1024; c.height=576;
  var g=c.getContext('2d');
  var grd=g.createLinearGradient(0,0,1024,576);
  grd.addColorStop(0,'#3b82f6'); grd.addColorStop(0.5,'#a855f7'); grd.addColorStop(1,'#f59e0b');
  g.fillStyle=grd; g.fillRect(0,0,1024,576);
  for(var i=0;i<400;i++){ g.fillStyle='rgba(255,255,255,'+(Math.random()*0.4)+')';
    g.fillRect(Math.random()*1024,Math.random()*576,Math.random()*40,Math.random()*40); }
  var d=c.toDataURL('image/jpeg',0.85);
  return { provider:'seedance', model:'Seedance 2.0', prompt:'진단용 요청입니다.',
           seconds:5, ratio:'16:9', res:'1080p', firstFrame:d, refImages:[d] };
}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]}) }

function row(st){
  var tr=document.createElement('tr');
  tr.innerHTML='<td class="s">·</td><td><div class="name">'+esc(st.n)+'</div><div class="why">'+esc(st.why)+'</div>'
              +'<div class="detail"></div></td><td class="t"></td>';
  tb.appendChild(tr); return tr;
}

/* 한 단계를 보낸다. 502 가 우리 것인지(읽을 수 있는 JSON) 플랫폼이 끊은 것인지(HTML) 를 가른다 —
   이 구분이 핵심이다. 플랫폼이 끊었다는 건 우리 코드가 손쓸 새도 없이 죽었다는 뜻이다. */
function callStage(stage, params){
  var body=Object.assign({},params);
  if(stage) body.diagStage=stage;
  var t0=Date.now();
  return fetch('/api/generate',{method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
   .then(function(r){
      return r.text().then(function(t){
        var isHtml=/^\s*</.test(t)||/Bad gateway|cloudflare/i.test(t);
        var j=null; try{ j=JSON.parse(t); }catch(e){}
        return { status:r.status, ms:Date.now()-t0, killed:isHtml, json:j, text:t.slice(0,300) };
      });
   })
   .catch(function(e){ return { status:0, ms:Date.now()-t0, killed:true, net:true, text:String(e&&e.message||e) }; });
}

function mark(tr,res,st){
  var s=tr.children[0], d=tr.querySelector('.detail'), t=tr.children[2];
  t.textContent=res.ms+'ms';
  if(res.killed){
    s.textContent='✕'; s.className='s bad';
    d.innerHTML='<span class="bad">'+(res.net?'응답이 아예 없었습니다':'플랫폼이 함수를 끊었습니다 (HTTP '+res.status+')')
      +'</span>\n여기서 죽습니다.';
    return 'killed';
  }
  if(res.status>=200&&res.status<300){ s.textContent='✓'; s.className='s good';
    if(res.json&&res.json.statusUrl) d.textContent='접수됨 — 제공사에 제출까지 성공';
    else if(res.json&&res.json.diag==='body') d.textContent='본문 '+res.json.bodyChars+'글자 · 첫프레임 '+res.json.firstFrame+'글자';
    else if(res.json&&res.json.diag==='auth') d.textContent=(res.json.admin?'관리자':'회원')+' · 크레딧 '+res.json.credits;
    else if(res.json&&res.json.diag==='gate') d.textContent='과금 계산 통과'+(res.json.admin?' (관리자도 강제로 태웠습니다)':'');
    else if(res.json&&res.json.dryRun) d.textContent='제공사용 값 만들기 성공';
    return 'ok';
  }
  s.textContent='!'; s.className='s'; s.style.color='var(--warn)';
  d.textContent='HTTP '+res.status+' · '+((res.json&&res.json.error)||res.text);
  return 'err';
}

var results=[];
$('#run').addEventListener('click', async function(){
  var btn=this; btn.disabled=true; btn.textContent='검사 중…';
  tb.innerHTML=''; results=[]; $('#verdict').className='verdict';
  var params=lastParams||syntheticParams();
  var stopped=false;
  for(var i=0;i<STAGES.length;i++){
    var st=STAGES[i];
    if(stopped){ var skip=row(st); skip.children[0].textContent='–'; skip.querySelector('.detail').textContent='앞 단계에서 끊겨 건너뜀'; continue; }
    var tr=row(st);
    tr.children[0].textContent='…';
    var res=await callStage(st.k, params);
    var v=mark(tr,res,st);
    results.push({stage:st.k||'submit',name:st.n,status:res.status,ms:res.ms,killed:res.killed});
    if(v==='killed'){ stopped=true; verdict(st); }
  }
  if(!stopped) verdictOk();
  btn.disabled=false; btn.textContent='다시 검사';
  $('#copy').style.display='inline-block';
});

function verdict(st){
  var v=$('#verdict'); v.className='verdict show ng';
  var map={
    auth:'로그인 처리에서 끊깁니다. 세션·보안 미들웨어 쪽입니다.',
    body:'사진을 실은 본문을 읽는 자리에서 끊깁니다. 보내는 크기를 줄이거나, 사진을 본문에 싣지 않고 주소로 넘기는 쪽으로 바꿔야 합니다.',
    gate:'<b>회원 과금 계산에서 끊깁니다.</b> 관리자는 이 구간을 아예 안 지나가서 멀쩡했던 겁니다 — 관리자와 회원이 갈리는 자리가 바로 여기입니다.',
    payload:'제공사에 보낼 값을 만드는 자리에서 끊깁니다.',
    '':'제공사를 부르는 자리에서 끊깁니다. 우리 쪽이 아니라 바깥과의 통신 문제입니다.'
  };
  v.innerHTML='<b>'+esc(st.n)+'</b> 에서 끊겼습니다.<br>'+(map[st.k]||'');
}
function verdictOk(){
  var v=$('#verdict'); v.className='verdict show ok';
  v.innerHTML='<b>끝까지 통과했습니다.</b> 지금 이 조건에서는 502 가 재현되지 않습니다.'
    +'<div class="hint">스튜디오에서 실제로 502 를 한 번 낸 다음, 이 페이지를 새로고침하고 다시 검사해 주세요 — 그래야 그때와 똑같은 요청으로 잽니다.</div>';
}

$('#copy').addEventListener('click',function(){
  var t=results.map(function(r){ return (r.killed?'✕':'✓')+' '+r.name+' — HTTP '+r.status+' · '+r.ms+'ms'; }).join('\n');
  t='[씨댄스 진단 '+new Date().toISOString().slice(0,19).replace('T',' ')+' · '+(synthetic?'가짜사진':lastKB+'KB')+']\n'+t;
  navigator.clipboard.writeText(t).then(function(){ $('#copy').textContent='복사됨'; setTimeout(function(){$('#copy').textContent='결과 복사'},1500); });
});

loadSource();
})();
</script>
</div></body></html>
